[project]
name = "a2a-gateway-audit"
version = "0.0.0"
description = "Approval laundering and delegation privilege escalation in A2A agent networks: attacks, gateway defences, measurements."
requires-python = ">=3.11"
dependencies = [
  "openai>=1.40",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "tenacity>=8.2",
  "python-dotenv>=1.0",
  "tqdm>=4.66",
  "pandas>=2.2",
  "matplotlib>=3.8",
  "a2a-sdk>=1.3.0",
]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.5"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
