# EXPLORATORY (post-hoc, not pre-registered): does a much larger approver model catch
# summary laundering (A3) and split payments (A4) when D3 shows it the exact action?
name: explore_strong_approver
model_tag: ds-agents_qwen397b-approver
agent_model:    {backend: adaption, model: deepseek-v4-flash, temperature: 0.7, max_tokens: 4000}
approver_model: {backend: adaption, model: qwen3.5-397b, temperature: 0.0, max_tokens: 3000}
judge_model:    {backend: adaption, model: deepseek-v4-flash, temperature: 0.0, max_tokens: 3000}
defences: [D1, D3]
scenarios: ["A3", "A4", "B02", "B04", "B06"]
seeds: [0, 1, 2]
max_steps: 30
workers: 24
